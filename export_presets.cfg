; Preset di esportazione.
;
; Fino a qui Carnivalz si poteva solo APRIRE nell'editor: non esisteva nessun
; modo di darlo a qualcuno che Godot non ce l'ha. Con questo file, Progetto >
; Esporta trova le due destinazioni gia' pronte, e dalla riga di comando:
;
;   godot --headless --export-release "Linux"   build/Carnivalz.x86_64
;   godot --headless --export-release "Windows" build/Carnivalz.exe
;
; Servono i "template di esportazione" installati (Editor > Gestisci template):
; sono il guscio dell'eseguibile, non stanno nel repo e pesano troppo per starci.
;
; exclude_filter tiene fuori dal pacchetto quello che serve a noi e non al
; giocatore: le prove, il simulatore, gli strumenti e la documentazione.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="prove/*, strumenti/*, docs/*, *.md"
export_path="build/Carnivalz.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="prove/*, strumenti/*, docs/*, *.md"
export_path="build/Carnivalz.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/icon="res://icon.svg"
application/product_name="Carnivalz"
application/company_name="Rio Chico"
